<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Anada Coalition — System of Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#08080A;
  --panel:#101012;
  --panel-2:#16151A;
  --crimson:#831312;
  --crimson-deep:#5C0B0B;
  --crimson-lit:#B02322;
  --gold:#DDC275;
  --gold-dim:#9C8749;
  --silver:#C6C6C6;
  --parchment:#E9E5DF;
  --muted:#8A8480;
  --rule:#2A2830;
  --display:'Marcellus SC',Georgia,serif;
  --body:'Spectral',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{
  margin:0;background:var(--void);color:var(--parchment);
  font-family:var(--body);font-weight:300;font-size:17px;line-height:1.72;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(131,19,18,.20), transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 105%, rgba(221,194,117,.06), transparent 70%);
}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 28px}

/* ---------- SIGNATURE: the bisected rule ---------- */
/* the logo is split down its axis: hollow silver at left, solid crimson at right.
   every divider in this document repeats that split. */
.bisect{display:flex;align-items:stretch;height:2px;margin:0}
.bisect i{display:block;flex:1}
.bisect i:first-child{background:linear-gradient(90deg,transparent,var(--silver));opacity:.5}
.bisect i:last-child{background:linear-gradient(90deg,var(--crimson),var(--crimson-deep))}

/* ---------- HERO ---------- */
header.hero{
  min-height:100svh;display:grid;place-items:center;text-align:center;
  padding:80px 28px 60px;position:relative;
}
.mark{
  width:min(46vmin,320px);aspect-ratio:1;margin:0 auto 44px;
  filter:drop-shadow(0 0 60px rgba(131,19,18,.45));
  animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both;
}
.mark img{width:100%;height:auto;display:block}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.42em;text-transform:uppercase;
  color:var(--gold-dim);margin:0 0 22px;animation:fade 1.2s .3s both;
}
h1.title{
  font-family:var(--display);font-weight:400;
  font-size:clamp(2.4rem,7vw,5.2rem);line-height:.98;margin:0;
  letter-spacing:.01em;animation:fade 1.2s .45s both;
}
h1.title .of{display:block;font-size:.34em;letter-spacing:.3em;color:var(--muted);margin-top:26px}
.hero-sub{
  max-width:46ch;margin:34px auto 0;color:var(--muted);font-size:1.02rem;font-style:italic;
  animation:fade 1.2s .6s both;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scroll-cue{
  position:absolute;bottom:34px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--rule);
  text-transform:uppercase;animation:fade 1.2s 1.1s both;
}

/* ---------- THESIS SPLIT ---------- */
.thesis{padding:96px 0 84px}
.thesis-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:0;align-items:stretch}
.thesis-half{padding:38px 42px}
.thesis-half.left{text-align:right}
.thesis-spine{width:2px;background:linear-gradient(180deg,transparent,var(--rule) 15%,var(--rule) 85%,transparent)}
.thesis-half h2{
  font-family:var(--display);font-size:1.9rem;font-weight:400;margin:0 0 4px;
}
.thesis-half.left h2{color:var(--silver)}
.thesis-half.right h2{color:var(--crimson-lit)}
.thesis-half .kicker{
  font-family:var(--mono);font-size:10px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--muted);margin:0 0 16px;
}
.thesis-half p{margin:0;color:#CFC9C2;font-size:1.02rem}
.thesis-note{
  max-width:60ch;margin:52px auto 0;text-align:center;font-style:italic;color:var(--muted);
}
.thesis-note strong{color:var(--gold);font-style:normal;font-weight:400}

/* ---------- NAV ---------- */
nav.toc{
  position:sticky;top:0;z-index:50;background:rgba(8,8,10,.93);
  backdrop-filter:blur(14px);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
}
nav.toc ol{
  list-style:none;margin:0;padding:11px 28px;display:flex;gap:26px;
  overflow-x:auto;max-width:1180px;margin:0 auto;scrollbar-width:none;
}
nav.toc ol::-webkit-scrollbar{display:none}
nav.toc a{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;white-space:nowrap;transition:color .2s;
}
nav.toc a:hover,nav.toc a:focus-visible{color:var(--gold)}
nav.toc .num{color:var(--crimson-lit);margin-right:7px}

/* ---------- SECTIONS ---------- */
section{padding:88px 0 20px;scroll-margin-top:64px}
.sec-head{display:flex;align-items:baseline;gap:20px;margin-bottom:8px}
.sec-num{
  font-family:var(--mono);font-size:12px;letter-spacing:.24em;color:var(--crimson-lit);
  flex:0 0 auto;padding-top:6px;
}
h2.sec{
  font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,3.6vw,2.7rem);
  margin:0;line-height:1.08;letter-spacing:.005em;
}
.sec-lede{
  max-width:66ch;color:var(--muted);font-style:italic;margin:10px 0 0;font-size:1.02rem;
}
.body{max-width:74ch;margin-top:30px}
.body.wide{max-width:none}
h3{
  font-family:var(--display);font-weight:400;font-size:1.34rem;
  margin:44px 0 12px;color:var(--gold);letter-spacing:.01em;
}
h4{
  font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--muted);margin:32px 0 10px;
}
p{margin:0 0 18px}
strong{font-weight:600;color:#F5F1EB}
em{color:#D8D2CA}
a{color:var(--gold)}
ul{margin:0 0 20px;padding-left:0;list-style:none}
ul li{position:relative;padding-left:24px;margin-bottom:9px}
ul li::before{
  content:'';position:absolute;left:2px;top:.72em;width:9px;height:1px;background:var(--crimson);
}

/* ---------- PULL / DOCTRINE ---------- */
.pull{
  margin:36px 0;padding:22px 0 22px 28px;border-left:2px solid var(--crimson);
  font-size:1.16rem;line-height:1.6;color:#F0EBE4;
}
.pull.gold{border-left-color:var(--gold-dim)}
.note{
  margin:26px 0;padding:18px 22px;background:var(--panel);border:1px solid var(--rule);
  font-size:.95rem;color:var(--muted);font-style:italic;
}
.note strong{color:var(--parchment);font-style:normal}
.warn{
  margin:26px 0;padding:20px 24px;background:linear-gradient(90deg,rgba(131,19,18,.16),rgba(131,19,18,.03));
  border-left:2px solid var(--crimson-lit);font-size:.97rem;
}
.warn h4{margin-top:0;color:var(--crimson-lit)}

/* ---------- TABLES ---------- */
.tbl{width:100%;border-collapse:collapse;margin:26px 0;font-size:.95rem}
.tbl th{
  font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--rule);
}
.tbl td{padding:11px 14px;border-bottom:1px solid rgba(42,40,48,.55);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl .k{font-weight:600;color:#F5F1EB;white-space:nowrap}
.tbl .n{font-family:var(--mono);font-size:.9rem;color:var(--gold);text-align:center;white-space:nowrap}
.tbl .dim{color:var(--muted);font-size:.9rem}
.tbl tbody tr:hover{background:rgba(131,19,18,.05)}
.tbl.restrict td{background:rgba(92,11,11,.07)}

/* ---------- RANK LADDER ---------- */
.ladder{margin:34px 0;border-top:1px solid var(--rule)}
.rung{
  display:grid;grid-template-columns:118px 1fr 1.1fr;gap:26px;
  padding:20px 0;border-bottom:1px solid var(--rule);align-items:start;
}
.rung .r-id{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--crimson-lit);text-transform:uppercase;padding-top:5px}
.rung .r-name{font-family:var(--display);font-size:1.22rem;color:var(--parchment)}
.rung .r-desc{color:var(--muted);font-size:.92rem;font-style:italic;margin-top:3px}
.rung .r-grant{color:#CFC9C2;font-size:.94rem}
.rung:hover .r-name{color:var(--gold)}

/* ---------- PATHS ---------- */
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:1px;background:var(--rule);margin:34px 0;border:1px solid var(--rule)}
.path{background:var(--panel);padding:28px 26px}
.path .glyph{font-size:26px;line-height:1;margin-bottom:14px;display:block}
.path h3{margin:0 0 6px;font-size:1.28rem;color:var(--parchment)}
.path .creed{font-style:italic;color:var(--gold-dim);font-size:.92rem;margin:0 0 16px;line-height:1.5}
.path .flavor{font-size:.9rem;color:var(--muted);margin:0 0 18px;line-height:1.62}
.path dl{margin:0;font-size:.9rem}
.path dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--crimson-lit);margin-top:14px}
.path dd{margin:5px 0 0;color:#CFC9C2}
.path dd b{color:var(--parchment);font-weight:600}

/* ---------- FORMS ---------- */
.forms{margin:34px 0}
.form{
  display:grid;grid-template-columns:150px 1fr;gap:28px;
  padding:24px 0;border-bottom:1px solid var(--rule);
}
.form:first-child{border-top:1px solid var(--rule)}
.form .f-name{font-family:var(--display);font-size:1.16rem;color:var(--gold)}
.form .f-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.form .f-desc{font-style:italic;color:var(--muted);font-size:.92rem;margin:0 0 12px}
.form .sig{font-size:.97rem;margin:0 0 8px}
.form .sig b{color:var(--crimson-lit);font-weight:600}
.form .ap{font-family:var(--mono);font-size:.86rem;color:var(--gold);letter-spacing:.06em}
.form .cost{font-size:.89rem;color:var(--muted);font-style:italic;margin:0}

/* ---------- FAMILY GRID ---------- */
.fam-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin:30px 0}
.fam{background:var(--panel);padding:18px 20px}
.fam h4{margin:0 0 6px;color:var(--parchment);font-size:11px;letter-spacing:.2em}
.fam .rolls{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--gold-dim);text-transform:uppercase;margin-bottom:8px}
.fam p{font-size:.85rem;color:var(--muted);margin:0;line-height:1.6}
.fam .count{font-family:var(--mono);font-size:9.5px;color:var(--crimson-lit);margin-top:9px}

/* ---------- DICE ---------- */
.dice{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin:28px 0}
.die{background:var(--panel);padding:18px 18px 20px}
.die .pip{font-family:var(--mono);font-size:22px;color:var(--crimson-lit);line-height:1}
.die .loc{font-family:var(--display);font-size:1.02rem;color:var(--parchment);margin:8px 0 4px}
.die .pen{font-family:var(--mono);font-size:.82rem;color:var(--gold)}

/* ---------- FOOTER ---------- */
footer{padding:90px 0 70px;text-align:center;margin-top:80px;border-top:1px solid var(--rule)}
footer .fmark{width:78px;margin:0 auto 26px;opacity:.5}
footer .fmark img{width:100%;display:block}
footer p{color:var(--muted);font-size:.9rem;font-style:italic;max-width:52ch;margin:0 auto 8px}
footer .sig-line{font-family:var(--mono);font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold-dim);margin-top:26px}


/* ---------- PRELUDE (lore) ---------- */
section.prelude .sec-num{color:var(--gold)}
.founders{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin:30px 0}
.fdr{background:var(--panel);padding:20px 22px}
.fdr-n{font-family:var(--display);font-size:1.1rem;color:var(--gold)}
.fdr-d{font-size:.86rem;color:var(--muted);font-style:italic;margin-top:5px;line-height:1.5}

/* ---------- SELF-STUDY STAGES ---------- */
.stages{margin:30px 0;border-top:1px solid var(--rule)}
.stage{display:grid;grid-template-columns:56px 1fr;gap:20px;padding:20px 0;border-bottom:1px solid var(--rule);align-items:start}
.st-n{font-family:var(--mono);font-size:15px;color:var(--crimson-lit);letter-spacing:.14em;padding-top:3px}
.st-t{font-family:var(--display);font-size:1.14rem;color:var(--gold);margin-bottom:6px}
.stage p{margin:0;font-size:.95rem;color:#CFC9C2}
@media (max-width:820px){.stage{grid-template-columns:1fr;gap:6px}.st-n{padding-top:0}}

:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

@media (max-width:820px){
  body{font-size:16px}
  .thesis-grid{grid-template-columns:1fr}
  .thesis-spine{width:auto;height:1px;background:var(--rule);margin:0 42px}
  .thesis-half.left{text-align:left}
  .rung{grid-template-columns:1fr;gap:8px}
  .rung .r-id{padding-top:0}
  .form{grid-template-columns:1fr;gap:10px}
  .sec-head{flex-direction:column;gap:6px}
  .sec-num{padding-top:0}
  .tbl{font-size:.88rem}
  .tbl th,.tbl td{padding:9px 9px}
}
</style>
</head>
